<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon Frigo — Recettes & Inventaire</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧊</text></svg>" />
</head>
<body>

  <!-- HEADER -->
  <header class="app-header">
    <div class="header-top">
      <div class="app-logo">
        <div class="logo-icon">🧊</div>
        <span>Mon Frigo</span>
      </div>
      <div class="header-actions">
        <button class="btn btn-ghost" id="btn-export" title="Exporter les donnees">📥 Export</button>
        <button class="btn btn-ghost" id="btn-import" title="Importer des donnees">📤 Import</button>
        <input type="file" id="import-file" accept=".json" style="display:none" />
      </div>
    </div>
    <nav class="nav-tabs">
      <button class="nav-tab active" data-tab="recipes">📖 Recettes</button>
      <button class="nav-tab" data-tab="fridge">🧊 Frigo</button>
      <button class="nav-tab" data-tab="shopping">🛒 Courses</button>
      <button class="nav-tab" data-tab="suggestions">💡 Suggestions</button>
    </nav>
  </header>

  <!-- ALERTS -->
  <div id="expiry-alerts"></div>

  <!-- TAB: RECIPES -->
  <div class="tab-content active" id="tab-recipes">
    <div class="tab-header">
      <div>
        <h1 class="tab-title">Mes Recettes</h1>
        <span class="tab-count" id="recipes-count">0 recettes</span>
      </div>
      <button class="btn btn-primary" onclick="app.showAddRecipeModal()">+ Ajouter</button>
    </div>
    <div class="search-box">
      <input type="text" id="recipe-search" placeholder="Rechercher une recette ou un ingredient..." />
    </div>
    <div id="recipes-list"></div>
  </div>

  <!-- TAB: FRIDGE -->
  <div class="tab-content" id="tab-fridge">
    <div class="tab-header">
      <div>
        <h1 class="tab-title">Mon Frigo</h1>
        <span class="tab-count" id="fridge-count">0 articles</span>
      </div>
      <button class="btn btn-primary" onclick="app.showAddFridgeModal()">+ Ajouter</button>
    </div>
    <div id="fridge-list"></div>
  </div>

  <!-- TAB: SHOPPING -->
  <div class="tab-content" id="tab-shopping">
    <div class="tab-header">
      <div>
        <h1 class="tab-title">Liste de Courses</h1>
        <span class="tab-count" id="shopping-count">0 articles</span>
      </div>
    </div>
    <div class="shopping-add">
      <input type="text" id="shopping-input" placeholder="Ajouter un article..." />
      <button class="btn btn-primary" onclick="app.addShoppingItem()">+</button>
    </div>
    <div id="shopping-list"></div>
    <div class="shopping-actions">
      <button class="btn btn-ghost" onclick="app.clearCheckedShopping()">Supprimer les coches</button>
      <button class="btn btn-primary" onclick="app.moveCheckedToFridge()">Ajouter les coches au frigo</button>
    </div>
  </div>

  <!-- TAB: SUGGESTIONS -->
  <div class="tab-content" id="tab-suggestions">
    <div class="tab-header">
      <div>
        <h1 class="tab-title">Suggestions</h1>
        <span class="tab-count">Selon ton frigo et la saison</span>
      </div>
    </div>
    <div id="suggestions-content"></div>
  </div>

  <!-- MODAL: ADD RECIPE -->
  <div class="modal-overlay" id="modal-add-recipe">
    <div class="modal">
      <div class="modal-header">
        <h2>Nouvelle Recette</h2>
        <button class="btn-icon" onclick="app.closeModal('modal-add-recipe')">✕</button>
      </div>
      <form id="recipe-form" onsubmit="event.preventDefault(); app.saveRecipe();">
        <div class="form-group">
          <label for="r-name">Nom de la recette *</label>
          <input type="text" id="r-name" required placeholder="Ex: Pates carbonara" />
        </div>
        <div class="form-group">
          <label for="r-source">Lien Instagram (optionnel)</label>
          <input type="url" id="r-source" placeholder="https://www.instagram.com/p/..." />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="r-tags">Tags (separes par des virgules)</label>
            <input type="text" id="r-tags" placeholder="Plat, Italien, Rapide" />
          </div>
          <div class="form-group">
            <label for="r-servings">Personnes</label>
            <input type="number" id="r-servings" min="1" max="20" placeholder="4" />
          </div>
        </div>
        <div class="form-group">
          <label for="r-preptime">Temps de preparation (min)</label>
          <input type="number" id="r-preptime" min="1" placeholder="30" />
        </div>
        <div class="form-group">
          <label>Ingredients</label>
          <div id="ingredients-list"></div>
          <button type="button" class="btn btn-ghost" onclick="app.addIngredientRow()" style="margin-top:8px">+ Ingredient</button>
        </div>
        <div class="form-group">
          <label for="r-steps">Etapes de preparation</label>
          <textarea id="r-steps" rows="4" placeholder="Decris les etapes de la recette..."></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" onclick="app.closeModal('modal-add-recipe')">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: ADD FRIDGE ITEM -->
  <div class="modal-overlay" id="modal-add-fridge">
    <div class="modal">
      <div class="modal-header">
        <h2>Ajouter au Frigo</h2>
        <button class="btn-icon" onclick="app.closeModal('modal-add-fridge')">✕</button>
      </div>
      <form id="fridge-form" onsubmit="event.preventDefault(); app.saveFridgeItem();">
        <div class="form-group">
          <label for="f-name">Nom de l'article *</label>
          <input type="text" id="f-name" required placeholder="Ex: Poulet" />
        </div>
        <div class="form-group">
          <label for="f-category">Categorie</label>
          <select id="f-category"></select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="f-quantity">Quantite</label>
            <input type="text" id="f-quantity" placeholder="500" />
          </div>
          <div class="form-group">
            <label for="f-unit">Unite</label>
            <input type="text" id="f-unit" placeholder="g, L, pieces..." />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="f-purchased">Date d'achat</label>
            <input type="date" id="f-purchased" />
          </div>
          <div class="form-group">
            <label for="f-expires">Date de peremption</label>
            <input type="date" id="f-expires" />
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" onclick="app.closeModal('modal-add-fridge')">Annuler</button>
          <button type="submit" class="btn btn-primary">Ajouter</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
